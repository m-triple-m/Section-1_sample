<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex justify-center items-center h-screen bg-gray-100">

    <div class="shadow-xl w-1/5 rounded-xl p-8 bg-white">

        <h3 class="text-2xl font-bold text-center my-5">
            Login Form
        </h3>

        <form>

            <label for="">Email Address</label>
            <input type="email" class="border w-full px-4 py-2 rounded-lg mb-4" />

            <label for="">Password</label>
            <input type="password" class="border w-full px-4 py-2 rounded-lg mb-4" />

            <a href="#" class="block text-[blueviolet] text-right mb-3">
                Forgot Password
            </a>

            <button class="bg-[blueviolet] w-full text-white p-2 rounded-lg">Submit</button>

            <a href="#" class="block text-[blueviolet] text-center mt-3">Create New Account</a>

        </form>

    </div>

</body>

</html>
