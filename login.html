<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link
        href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic"
        rel="stylesheet" />

    <style>
        * {
            font-family: Roboto;
        }

        .card {
            /* border: 2px solid red; */
            width: 20%;

            border-radius: 10px;
            padding: 30px;

            box-shadow: 3px 3px 5px 0 #0000007b;
            background-color: white;
        }

        body {
            display: flex;

            justify-content: center;
            align-items: center;

            height: 100vh;
            /* background-color: #ccc; */

            /* background-image: linear-gradient(60deg, #a7a7ff, #ff9b9b); */

            background-image: url('https://images.wallpapersden.com/image/download/minimal-hd-landscape_bWhsZ2WUmZqaraWkpJRmbmdlrWZlbWU.jpg');

            background-size: cover;

        }

        .form-title {
            text-align: center;
        }

        .text-input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid black;
            box-sizing: border-box;
        }

        .btn {
            background-color: blueviolet;
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
        }

        .link {
            text-decoration: none;
            color: blueviolet;
            display: block;
        }

        .forget-link {
            text-align: right;
            margin-bottom: 10px;
        }

        .signup-link {
            text-align: center;
            margin-top: 10px;
        }
    </style>

</head>

<body>

    <div class="card">

        <h3 class="form-title">Login Form</h3>

        <form>

            <label for="">Email Address</label>
            <input type="email" class="text-input">

            <label for="">Password</label>
            <input type="password" class="text-input">

            <a href="#" class="link forget-link">Forgot Password</a>

            <button class="btn">Submit</button>

            <a href="#" class="link signup-link">Create New Account</a>

        </form>

    </div>

</body>

</html>
